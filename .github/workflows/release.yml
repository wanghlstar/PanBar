name: Release

# 打 tag 自动构建版本化发布:
#   git tag v0.2.0 && git push origin v0.2.0
# CI 会以该版本号构建,并把 PanBar.zip 挂到对应的 GitHub Release 上。
#
# 注意:runner 没有签名证书,产物为「未签名」。
# 本地使用:xattr -cr PanBar.app && codesign --force --deep -s - PanBar.app
# 公开分发(签名+公证+DMG)需要 Apple Developer 账号,见 docs/RELEASING.md。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Versioned Release
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # MARKETING_VERSION 取 tag 号(去掉前缀 v),如 v0.2.0 → 0.2.0
      - name: Build (Release)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project PanBar.xcodeproj \
            -scheme PanBar \
            -configuration Release \
            -derivedDataPath build/dd \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package
        run: |
          cd build/dd/Build/Products/Release
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent PanBar.app PanBar.zip
          ls -lh PanBar.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dd/Build/Products/Release/PanBar.zip
          make_latest: true
          body: |
            ## PanBar ${GITHUB_REF_NAME}

            自动构建(未签名,含定时显示 + 交易日历功能)。

            ### 本地使用
            ```
            xattr -cr PanBar.app
            codesign --force --deep -s - PanBar.app
            ```
            或直接跑仓库里的 `scripts/update-app.sh`(自动下载安装 nightly)。
